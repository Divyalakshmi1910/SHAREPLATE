<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – SharePlate Food Donation</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <div class="brand-icon">🌱</div>
                <span>SharePlate</span>
            </a>

            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="available-donations.html" class="nav-link">Available Food</a>
            </div>

            <div class="nav-actions" id="nav-auth-actions">
                <a href="register.html" class="btn btn-sm btn-primary">Create Account</a>
            </div>

            <button class="nav-toggle" aria-label="Toggle navigation">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Main Login Content -->
    <main style="flex:1; padding:60px 0;">
        <div class="container">
            <div class="form-card">
                <div class="form-header">
                    <h1>Welcome Back</h1>
                    <p>Log in to manage your food donations or claim surplus meals.</p>
                </div>

                <!-- Instant 1-Click Quick Demo Credentials Container -->
                <div class="demo-accounts">
                    <div class="demo-accounts-title">
                        <span>⚡ Quick-Fill Demo Profiles (1-Click Test)</span>
                    </div>
                    <div class="demo-buttons-flex">
                        <button type="button" class="btn-demo-pill btn-quick-fill" 
                                data-email="donor@greengarden.com" data-password="donor123">
                            🥦 Donor (Restaurant)
                        </button>
                        <button type="button" class="btn-demo-pill btn-quick-fill" 
                                data-email="canteen@citycollege.edu" data-password="donor123">
                            🏫 Donor (College Canteen)
                        </button>
                        <button type="button" class="btn-demo-pill btn-quick-fill" 
                                data-email="relief@hopeshelter.org" data-password="ngo123">
                            🤝 NGO (Hope Shelter)
                        </button>
                        <button type="button" class="btn-demo-pill btn-quick-fill" 
                                data-email="admin@shareplate.org" data-password="admin123">
                            ⚙️ Platform Admin
                        </button>
                    </div>
                </div>

                <!-- Login Form -->
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email" class="form-label">Email Address <span class="required">*</span></label>
                        <input type="email" id="login-email" class="form-control" placeholder="e.g. donor@greengarden.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                            <label for="login-password" class="form-label" style="margin-bottom:0;">Password <span class="required">*</span></label>
                        </div>
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    </div>

                    <div style="margin-bottom:24px;">
                        <button type="submit" class="btn btn-primary btn-block btn-lg">
                            Log In to SharePlate
                        </button>
                    </div>

                    <div style="text-align:center; font-size:0.92rem; color:var(--text-secondary);">
                        Don't have an account yet? 
                        <a href="register.html" style="font-weight:700; color:var(--primary-dark);">Register here</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="padding:30px 0;">
        <div class="container" style="text-align:center; font-size:0.85rem; color:#94a3b8;">
            &copy; 2026 SharePlate – Modern Food Donation &amp; Redistribution Platform.
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
